<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeCraft · 校招简历工作台</title>
<style>
/* style.css — 简历工作台 UI + 4 套简历主题 + 打印样式 */

/* ========== 基础与变量 ========== */
:root {
  --bg: #f4f6fa;
  --bg-panel: #ffffff;
  --bg-hover: rgba(31, 41, 55, 0.05);
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #1e293b;
  --text-2: #64748b;
  --accent: #2563eb;
  --accent-weak: rgba(37, 99, 235, 0.1);
  --danger: #dc2626;
  --ok: #059669;
  --warn: #d97706;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 8px 24px rgba(15, 23, 42, 0.06);
  --radius: 10px;
  --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
[data-theme="dark"] {
  --bg: #0f1420;
  --bg-panel: #171e2e;
  --bg-hover: rgba(255, 255, 255, 0.06);
  --border: #263046;
  --border-strong: #35415c;
  --text: #e6eaf2;
  --text-2: #8b96ab;
  --accent: #6d9bff;
  --accent-weak: rgba(109, 155, 255, 0.14);
  --danger: #f87171;
  --ok: #34d399;
  --warn: #fbbf24;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
}
button { font-family: inherit; }

.app { display: flex; flex-direction: column; height: 100vh; }

/* ========== 顶栏 ========== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}
.brand { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.brand-mark { font-size: 18px; }
.badge {
  font-size: 11px; font-weight: 600; color: var(--accent);
  background: var(--accent-weak); border-radius: 20px; padding: 2px 8px;
}
.ghost-badge { color: var(--text-2); background: var(--bg); border: 1px solid var(--border); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.save-status { font-size: 12px; color: var(--text-2); margin-right: 4px; }
.save-status.saved { color: var(--ok); }

/* ========== 按钮 ========== */
.btn {
  border: 1px solid var(--border-strong); background: var(--bg-panel);
  color: var(--text); border-radius: 8px; padding: 6px 14px; font-size: 13px;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn.small { padding: 3px 10px; font-size: 12px; border-radius: 6px; }
.btn.big { padding: 10px 26px; font-size: 15px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.spacer { flex: 1; }

/* ========== 选项卡 ========== */
.tabs {
  display: flex; gap: 2px; padding: 8px 16px 0;
  background: var(--bg-panel); border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.tab {
  border: none; background: transparent; color: var(--text-2);
  font-size: 14px; padding: 8px 14px; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.main { flex: 1; overflow: hidden; position: relative; }
.tab-panel { display: none; height: 100%; overflow: auto; }
.tab-panel.active { display: block; }

/* ========== 编辑页 ========== */
.edit-layout { display: flex; height: 100%; }
.form-pane { flex: 1 1 52%; min-width: 0; overflow-y: auto; padding: 16px 20px 60px; }
.mini-preview {
  flex: 1 1 48%; min-width: 0; border-left: 1px solid var(--border);
  background: var(--bg); display: flex; flex-direction: column;
}
.mini-preview-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; font-size: 13px; color: var(--text-2);
  border-bottom: 1px solid var(--border);
}
.mini-preview-body { flex: 1; overflow: auto; padding: 24px 16px; display: flex; justify-content: center; }

/* 表单 */
.form-section { margin-bottom: 14px; }
.form-section-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--bg-panel);
  border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; user-select: none;
}
.form-section-head h2 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
.form-section-head .tip { font-size: 12px; color: var(--text-2); font-weight: 400; }
.form-section-head .chevron { color: var(--text-2); font-size: 12px; transition: transform .15s; }
.form-section.collapsed .chevron { transform: rotate(-90deg); }
.form-section-body { display: block; margin-top: 8px; }
.form-section.collapsed .form-section-body { display: none; }

.entry-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
  position: relative;
}
.entry-card-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; color: var(--text-2); margin-bottom: 8px;
}
.entry-card-head .idx { font-weight: 600; color: var(--text); }
.entry-remove {
  border: none; background: transparent; color: var(--text-2);
  cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 6px;
}
.entry-remove:hover { color: var(--danger); background: rgba(220, 38, 38, 0.08); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: 12px; color: var(--text-2); }
.form-field input, .form-field select, .form-field textarea {
  font-family: inherit; font-size: 13px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; outline: none; width: 100%;
}
.form-field textarea { resize: vertical; min-height: 72px; line-height: 1.7; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-weak);
}
.form-field .hint { font-size: 11px; color: var(--text-2); }
.field-row { display: flex; gap: 12px; }
.field-row .form-field { flex: 1; }
.add-btn {
  width: 100%; border: 1px dashed var(--border-strong); background: transparent;
  color: var(--text-2); border-radius: var(--radius); padding: 8px; cursor: pointer;
  font-size: 13px;
}
.add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }

/* 板块管理 */
.sec-mgr-list { display: flex; flex-direction: column; gap: 6px; }
.sec-mgr-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px;
}
.sec-mgr-row.hidden { opacity: 0.55; }
.sec-mgr-idx { font-size: 12px; color: var(--text-2); width: 18px; text-align: center; flex: none; }
.sec-mgr-name { flex: 1; font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec-mgr-badge { font-size: 11px; color: var(--warn); background: rgba(217, 119, 6, .12); padding: 1px 8px; border-radius: 8px; flex: none; }
.sec-mgr-actions { display: flex; gap: 4px; flex: none; }

.photo-wrap { display: flex; align-items: center; gap: 12px; }
.photo-wrap img { width: 64px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }

/* ========== 预览页 ========== */
.preview-toolbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px; background: var(--bg-panel);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
}
.preview-toolbar label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.preview-toolbar select {
  font-family: inherit; font-size: 13px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
}
.preview-body { padding: 24px 16px 60px; display: flex; justify-content: center; overflow: auto; }
.preview-compare { padding: 16px 20px 0; max-width: 1100px; margin: 0 auto; }
.compare-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.compare-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.compare-head h3 { margin: 0; font-size: 15px; }
.compare-head span { font-size: 12px; color: var(--text-2); }
.compare-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.compare-item + .compare-item { margin-top: 10px; }
.compare-item.shortened { border-left: 4px solid var(--warn); }
.compare-item.changed { border-left: 4px solid var(--accent); }
.compare-item.preserved { border-left: 4px solid var(--ok); }
.compare-item-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
.compare-title { font-size: 13px; font-weight: 700; }
.compare-status { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
.compare-status.preserved { background: rgba(5, 150, 105, .12); color: var(--ok); }
.compare-status.shortened { background: rgba(217, 119, 6, .12); color: var(--warn); }
.compare-status.changed { background: var(--accent-weak); color: var(--accent); }
.compare-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare-col-title { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.compare-text { white-space: pre-wrap; font-size: 12.5px; line-height: 1.7; color: var(--text); }
.scale-wrap { transform-origin: top left; }

/* ========== 简历页面（A4）与主题 ========== */
.page {
  width: 794px; min-height: 1123px; background: #fff; color: #1f2933;
  padding: 46px 52px; box-shadow: var(--shadow);
  font-size: 13px; line-height: 1.75;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", sans-serif;
  display: flex; flex-direction: column; gap: 16px;
}
.page * { box-sizing: border-box; }
.page.compact-page {
  padding: 38px 44px; font-size: 12px; line-height: 1.6; gap: 12px;
}
.page.compact-page .p-name { font-size: 27px; margin-bottom: 4px; }
.page.compact-page .p-contact { font-size: 11px; gap: 2px 10px; }
.page.compact-page .p-target { padding: 6px 10px; font-size: 12px; }
.page.compact-page .p-sec { gap: 4px; }
.page.compact-page .p-sec-h { font-size: 14px; }
.page.compact-page .p-edu-main, .page.compact-page .p-item-title { font-size: 12.5px; }
.page.compact-page .p-edu-line, .page.compact-page .p-item-sub, .page.compact-page .p-item-range,
.page.compact-page .p-award-line, .page.compact-page .p-skill-line, .page.compact-page .p-eval { font-size: 11.5px; }
.page.compact-page .p-bullets { margin-top: 2px; }
.page.compact-page .p-bullets li { margin-bottom: 1px; padding-left: 12px; }

.p-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.p-photo { width: 78px; height: 104px; object-fit: cover; border-radius: 6px; flex: none; }
.p-name { font-size: 30px; font-weight: 800; line-height: 1.25; margin-bottom: 6px; }
.p-contact { font-size: 12px; color: #4b5563; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.p-target {
  background: #f1f5f9; border-radius: 8px; padding: 8px 14px; font-size: 13px;
  color: #334155;
}
.p-target b { color: #1d4ed8; }

.p-sec { display: flex; flex-direction: column; gap: 6px; }
.p-sec-h {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 800; color: #111827; margin: 0;
}
.p-sec-h .en { font-size: 10px; color: #9ca3af; letter-spacing: 1px; font-weight: 400; }
.p-sec-h::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }

.p-edu-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.p-edu-main { font-weight: 700; font-size: 14px; }
.p-edu-meta { font-size: 12px; color: #4b5563; }
.p-edu-line { font-size: 12.5px; color: #374151; }

.p-item { margin-bottom: 2px; }
.p-item-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.p-item-title { font-weight: 700; font-size: 13.5px; }
.p-item-sub { font-size: 12px; color: #6b7280; }
.p-item-range { font-size: 12px; color: #4b5563; white-space: nowrap; }
.p-bullets { margin: 4px 0 0; padding: 0; list-style: none; }
.p-bullets li { position: relative; padding-left: 14px; margin-bottom: 3px; }
.p-bullets li::before { content: "▪"; position: absolute; left: 0; color: #9ca3af; font-size: 11px; top: 2px; }

.p-award-line { display: flex; gap: 8px; font-size: 12.5px; }
.p-award-line .lvl { color: #6b7280; }
.p-award-line .date { color: #9ca3af; margin-left: auto; }

.p-skill-line { display: flex; gap: 8px; font-size: 12.5px; margin-bottom: 3px; }
.p-skill-cat { font-weight: 700; flex: none; min-width: 64px; }
.p-eval { font-size: 12.5px; color: #374151; white-space: pre-wrap; }

/* 主题：简约蓝 */
.page.blue .p-sec-h { color: #1e40af; }
.page.blue .p-sec-h::after { background: #dbeafe; }
.page.blue .p-name { color: #1e3a8a; }
.page.blue .p-target b { color: #1d4ed8; }
/* 主题：商务灰 */
.page.business { font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif; }
.page.business .p-name { font-weight: 700; letter-spacing: 2px; }
.page.business .p-sec-h { font-weight: 700; letter-spacing: 1px; color: #111827; border-bottom: 2px solid #111827; padding-bottom: 4px; }
.page.business .p-sec-h::after { display: none; }
.page.business .p-sec-h .en { color: #6b7280; }
.page.business .p-target { background: #fff; border: 1px solid #d1d5db; }
/* 主题：清新绿 */
.page.fresh .p-sec-h { color: #047857; }
.page.fresh .p-sec-h::after { background: #d1fae5; }
.page.fresh .p-name { color: #064e3b; }
.page.fresh .p-target { background: #ecfdf5; }
.page.fresh .p-target b { color: #047857; }
.page.fresh .p-sec { background: #fbfefd; padding: 10px 12px; border-radius: 10px; border: 1px solid #e7f5ef; }
/* 主题：现代紫 */
.page.modern .p-sec-h { color: #6d28d9; }
.page.modern .p-sec-h::after { background: #ede9fe; }
.page.modern .p-name { color: #4c1d95; }
.page.modern .p-target { background: #f5f3ff; }
.page.modern .p-target b { color: #6d28d9; }
.page.modern .p-sec-h .en { letter-spacing: 2px; }

/* ========== 岗位模板可视化差异（让模板切换更直观） ========== */
.page.role-tech .p-item-title { letter-spacing: .2px; }
.page.role-tech .p-item-sub { color: #475569; }
.page.role-tech .p-bullets li::before { content: "▸"; color: #2563eb; }

.page.role-product .p-target,
.page.role-internet .p-target {
  border-left: 4px solid #7c3aed;
  background: linear-gradient(90deg, rgba(124, 58, 237, .10), rgba(124, 58, 237, .03));
}
.page.role-product .p-sec,
.page.role-internet .p-sec {
  gap: 8px;
}
.page.role-product .p-item,
.page.role-internet .p-item {
  padding-bottom: 6px;
  border-bottom: 1px dashed #e5e7eb;
}
.page.role-product .p-item:last-child,
.page.role-internet .p-item:last-child { border-bottom: none; }
.page.role-product .p-bullets li::before,
.page.role-internet .p-bullets li::before { content: "•"; color: #7c3aed; }

.page.role-operation .p-target,
.page.role-market .p-target {
  background: linear-gradient(90deg, rgba(234, 88, 12, .10), rgba(234, 88, 12, .03));
  border-left: 4px solid #ea580c;
}
.page.role-operation .p-award-line,
.page.role-market .p-award-line,
.page.role-operation .p-skill-line,
.page.role-market .p-skill-line {
  background: #fff7ed;
  border-radius: 8px;
  padding: 4px 8px;
}
.page.role-operation .p-bullets li::before,
.page.role-market .p-bullets li::before { content: "◆"; color: #ea580c; }

.page.role-design {
  font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.page.role-design .p-header {
  align-items: center;
}
.page.role-design .p-target {
  background: #faf5ff;
  border: 1px solid #e9d5ff;
}
.page.role-design .p-sec {
  background: #fcfcff;
  border: 1px solid #f1f5f9;
  border-radius: 12px;
  padding: 10px 12px;
}
.page.role-design .p-sec-h::after { display: none; }
.page.role-design .p-bullets li::before { content: "✦"; color: #a855f7; }

.page.role-function .p-target {
  background: #f8fafc;
  border: 1px solid #cbd5e1;
}
.page.role-function .p-sec-h {
  text-transform: uppercase;
  letter-spacing: .6px;
}
.page.role-function .p-bullets li::before { content: "-"; color: #64748b; }

/* ========== 体检页 ========== */
.audit-head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 20px; background: var(--bg-panel);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
}
.audit-summary { font-size: 13px; color: var(--text-2); }
.audit-body { padding: 16px 20px 60px; max-width: 960px; margin: 0 auto; }
.score-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px; margin-bottom: 16px;
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
}
.score-ring { position: relative; width: 96px; height: 96px; flex: none; }
.score-ring svg { transform: rotate(-90deg); }
.score-ring .num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 800;
}
.score-ring .num small { font-size: 12px; font-weight: 400; color: var(--text-2); }
.score-meta { flex: 1; min-width: 220px; }
.score-level { font-size: 18px; font-weight: 800; }
.score-level.good { color: var(--ok); } .score-level.mid { color: var(--warn); } .score-level.bad { color: var(--danger); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
.cat-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg);
}
.cat-card .cat-name { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
.cat-card .cat-bar { height: 6px; background: var(--border); border-radius: 4px; margin: 8px 0 4px; overflow: hidden; }
.cat-card .cat-bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.cat-card .cat-bar i.ok { background: var(--ok); } .cat-card .cat-bar i.mid { background: var(--warn); } .cat-card .cat-bar i.bad { background: var(--danger); }
.cat-card .cat-tip { font-size: 11px; color: var(--text-2); }
.issue-list { list-style: none; margin: 0; padding: 0; }
.issue {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-left: 4px solid var(--border-strong); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 8px;
}
.issue.error { border-left-color: var(--danger); }
.issue.warn { border-left-color: var(--warn); }
.issue.info { border-left-color: var(--accent); }
.issue .issue-title { font-weight: 600; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; }
.issue .issue-section { font-size: 11px; color: var(--text-2); background: var(--bg); padding: 1px 8px; border-radius: 10px; flex: none; }
.issue .issue-detail { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
.sev-tag { font-size: 10px; padding: 1px 7px; border-radius: 8px; flex: none; font-weight: 700; }
.sev-tag.error { background: rgba(220, 38, 38, .12); color: var(--danger); }
.sev-tag.warn { background: rgba(217, 119, 6, .12); color: var(--warn); }
.sev-tag.info { background: var(--accent-weak); color: var(--accent); }
.jd-evidence-card {
  margin: 14px 0; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
}
.jd-evidence-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
.jd-evidence-head h3 { margin: 0; font-size: 15px; }

.modal-mask {

}
.modal {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); width: min(560px, 100%); max-height: 86vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; border-bottom: 1px solid var(--border); font-weight: 700;

.modal-body { padding: 16px 18px; overflow: auto; font-size: 13.5px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border); }
.toast-root { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg-panel); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 10px 16px; font-size: 13px; box-shadow: var(--shadow);

}
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ========== 打印 ========== */
.print-only { display: none; }
@media print {
  @page { size: A4; margin: 12mm 14mm; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { background: #fff; }
  body > #app { display: none !important; }
  #printArea { display: block !important; margin: 0; padding: 0; }
  #printArea .page {
    width: auto; min-height: auto; box-shadow: none; margin: 0;
    padding: 0; gap: 16px; overflow: visible;
    break-inside: auto; page-break-inside: auto;
  }
  #printArea .page.compact-page {
    gap: 12px;
  }
  /* When one-page compression was requested, make print pagination match the compact preview. */
  body.print-fit-requested #printArea .page {
    zoom: var(--print-fit-scale, 0.94);
  }
}

<script>
/* engine.js — 简历体检规则引擎（纯函数，无 DOM 依赖，可在 Node 中单测）
 * 暴露全局 ResumeEngine。
 *
 * 评分结构：总分 100 = 硬伤 30 + 量化与结果 20 + 表达与结构 15 + 关键词匹配 20 + 完整度 15
 */
(function (global) {
  "use strict";

  var T = (typeof global.RESUME_TEMPLATES !== "undefined") ? global.RESUME_TEMPLATES : {};
  var VERBS = (typeof global.RESUME_ACTION_VERBS !== "undefined") ? global.RESUME_ACTION_VERBS : [];
  var EMPTY_PHRASES = (typeof global.RESUME_EMPTY_PHRASES !== "undefined") ? global.RESUME_EMPTY_PHRASES : [];

  /* ---------- 工具 ---------- */

  function hasText(v) {
    return typeof v === "string" && v.trim().length > 0;
  }

  /* 板块是否被用户隐藏（opts.hidden[key]） */
  function isHidden(hidden, key) {
    return !!(hidden && hidden[key]);
  }

  function hasDigit(s) {
    return /\d/.test(s);
  }

  function norm(v) {
    return (v || "").replace(/\s+/g, " ").trim();
  }

  /* 把经历内容拆成"要点"列表：按换行拆，超长段落再按中文句读拆 */
  function splitBullets(text) {
    if (!hasText(text)) return [];
    var out = [];
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      if (line.length > 120) {
        var parts = line.split(/[。；]/).map(function (p) { return p.trim(); }).filter(Boolean);
        if (parts.length > 1) { out = out.concat(parts); continue; }
      }
      out.push(line);
    }
    return out;
  }

  /* 时间范围开头的行（如 "2024.06-2024.09"）视为标题行，不参与要点检查 */
  var TIME_PREFIX = /^(\d{4}[.\-/年]\d{0,4}[.\-/月]?\s*[-—~至]\s*\d{0,4}[.\-/年]?\d{0,4}[.\-/月]?)/;

  function isHeaderLine(line) {
    return TIME_PREFIX.test(line) || /^(职责|工作内容|项目描述|主要工作|主要职责)[:：]/.test(line);
  }

  function startsWithVerb(line) {
    for (var i = 0; i < VERBS.length; i++) {
      if (line.indexOf(VERBS[i]) === 0) return true;
    }
    return false;
  }

  function containsEmptyPhrase(line) {
    for (var i = 0; i < EMPTY_PHRASES.length; i++) {
      if (line.indexOf(EMPTY_PHRASES[i]) >= 0) return true;
    }
    return false;
  }

  function isValidPhone(p) {
    return /^1[3-9]\d{9}$/.test(p.replace(/[\s-]/g, ""));
  }

  function isValidEmail(e) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  }

  /* 收集所有"经历内容"条目（实习/项目/校园），返回 [{key, label, content}]；隐藏板块不参与 */
  function collectContentEntries(resume, hidden) {
    var entries = [];
    var lists = [
      ["internships", "实习经历"],
      ["projects", "项目经历"],
      ["campus", "校园经历"]
    ];
    for (var l = 0; l < lists.length; l++) {
      var key = lists[l][0], label = lists[l][1];
      if (isHidden(hidden, key)) continue;
      var arr = (resume && resume[key]) || [];
      for (var i = 0; i < arr.length; i++) {
        var it = arr[i] || {};
        var title = it.company || it.name || it.org || ("第" + (i + 1) + "条");
        entries.push({ key: key, index: i, label: label + " · " + title, content: it.content || "" });
      }
    }
    return entries;
  }

  /* 全文（含各字段）拼成纯文本，用于关键词匹配；隐藏板块不参与 */
  function fullText(resume, hidden) {
    var parts = [];
    function push(v) { if (hasText(v)) parts.push(norm(v)); }
    if (!resume) return "";
    push(resume.basic && resume.basic.name);
    push(resume.basic && resume.basic.phone);
    push(resume.basic && resume.basic.email);
    push(resume.basic && resume.basic.city);
    push(resume.basic && resume.basic.website);
    push(resume.basic && resume.basic.github);
    if (!isHidden(hidden, "target")) {
      push(resume.target && resume.target.position);
      push(resume.target && resume.target.industry);
    }
    if (!isHidden(hidden, "education")) (resume.education || []).forEach(function (e) { push(e.school); push(e.major); push(e.degree); push(e.courses); push(e.honors); });
    if (!isHidden(hidden, "internships")) (resume.internships || []).forEach(function (e) { push(e.company); push(e.title); push(e.content); });
    if (!isHidden(hidden, "projects")) (resume.projects || []).forEach(function (e) { push(e.name); push(e.role); push(e.tech); push(e.content); });
    if (!isHidden(hidden, "campus")) (resume.campus || []).forEach(function (e) { push(e.org); push(e.role); push(e.content); });
    if (!isHidden(hidden, "research")) (resume.research || []).forEach(function (e) { push(e.kind); push(e.title); push(e.role); push(e.venue); push(e.note); });
    if (!isHidden(hidden, "awards")) (resume.awards || []).forEach(function (e) { push(e.name); push(e.level); });
    if (!isHidden(hidden, "skills")) (resume.skills || []).forEach(function (e) { push(e.category); push(e.items); });
    if (!isHidden(hidden, "evaluation")) push(resume.evaluation);
    if (!isHidden(hidden, "extra")) push(resume.extra);
    return parts.join(" ");
  }

  /* ---------- 各分类检查 ---------- */

  function auditHard(resume, items, hidden) {
    var score = 30;
    var errors = 0, warns = 0;
    var b = (resume && resume.basic) || {};
    var t = (resume && resume.target) || {};
    var edu = (resume && resume.education) || [];

    function err(msg, detail) { errors++; items.push({ severity: "error", code: "hard", title: msg, detail: detail || "", section: "基本信息" }); }
    function warn(msg, detail) { warns++; items.push({ severity: "warn", code: "hard", title: msg, detail: detail || "", section: "基本信息" }); }

    if (!hasText(b.name)) err("未填写姓名", "简历最上方应写明姓名，方便 HR 快速识别。");
    if (!hasText(b.phone)) err("未填写手机号", "HR 联系你的第一渠道，务必填写。");
    else if (!isValidPhone(b.phone)) warn("手机号格式可能不正确", "建议使用 11 位大陆手机号（1[3-9] 开头），当前：" + b.phone);
    if (!hasText(b.email)) err("未填写邮箱", "建议使用常用邮箱，避免错过笔试/面试通知。");
    else if (!isValidEmail(b.email)) warn("邮箱格式可能不正确", "当前：" + b.email + "，请检查是否漏写 @ 或域名。");
    if (!isHidden(hidden, "education")) {
      if (edu.length === 0) err("未添加教育背景", "应届生简历必须包含教育背景（学校、专业、学历、起止时间）。");
      else {
        for (var i = 0; i < edu.length; i++) {
          var e = edu[i] || {};
          var missing = [];
          if (!hasText(e.school)) missing.push("学校");
          if (!hasText(e.major)) missing.push("专业");
          if (!hasText(e.degree)) missing.push("学历");
          if (!hasText(e.start) || !hasText(e.end)) missing.push("起止时间");
          if (missing.length) warn("教育经历第 " + (i + 1) + " 条缺少：" + missing.join("、"), "HR 需要确认你的毕业时间与学制。");
        }
      }
    }
    if (!isHidden(hidden, "target") && !hasText(t.position)) err("未填写求职意向（目标岗位）", "校招简历必须写明目标岗位，否则 HR 无法判断匹配度。（若你确实不需要该板块，可在「板块管理」中隐藏它）");
    if (!hasText(b.city)) warn("未填写所在城市/意向城市", "便于 HR 判断你是否在当地或能否到场面试。");

    return Math.max(0, score - errors * 6 - warns * 3);
  }

  function auditQuantified(resume, items, hidden) {
    var entries = collectContentEntries(resume, hidden);
    var withContent = entries.filter(function (e) { return hasText(e.content); });
    var max = 20;
    if (withContent.length === 0) {
      if (entries.length === 0) {
        items.push({ severity: "info", code: "quantified", title: "暂无实习/项目/校园经历内容", detail: "应届生可先用课程项目、竞赛、社团活动补充经历板块；写完内容后记得给每条加量化数据。", section: "经历" });
      } else {
        items.push({ severity: "warn", code: "quantified", title: "经历条目均为空", detail: "已添加 " + entries.length + " 条经历但内容为空，请补全每一条的描述。", section: "经历" });
      }
      return 0;
    }
    var quantified = withContent.filter(function (e) { return hasDigit(e.content); });
    var ratio = quantified.length / withContent.length;
    for (var i = 0; i < withContent.length; i++) {
      if (!hasDigit(withContent[i].content)) {
        items.push({
          severity: "warn", code: "quantified",
          title: "「" + withContent[i].label + "」没有量化数据",
          detail: "建议补充数字：规模（用户数/人数/金额）、效率（耗时/百分比/次数）、结果（增长 X%、降低 Y%）。例如「负责XX」→「负责XX，覆盖 5000+ 用户，转化率提升 18%」。",
          section: withContent[i].label
        });
      }
    }
    items.push({
      severity: ratio >= 0.6 ? "info" : "warn", code: "quantified",
      title: "量化比例：" + Math.round(ratio * 100) + "%（" + quantified.length + "/" + withContent.length + " 条含数字）",
      detail: "目标：80% 以上的经历要点包含具体数字。量化是校招简历拉开差距的关键。",
      section: "经历"
    });
    return Math.round(max * Math.min(1, ratio / 0.8));
  }

  function auditExpression(resume, items, hidden) {
    var entries = collectContentEntries(resume, hidden);
    var max = 15;
    var total = 0, verbMiss = 0, emptyMiss = 0, longMiss = 0, shortMiss = 0;
    var evaluated = false;
    for (var i = 0; i < entries.length; i++) {
      var bullets = splitBullets(entries[i].content);
      for (var j = 0; j < bullets.length; j++) {
        var line = bullets[j];
        if (isHeaderLine(line)) continue;
        total++;
        evaluated = true;
        if (!startsWithVerb(line)) {
          verbMiss++;
          if (verbMiss <= 5) items.push({
            severity: "warn", code: "expression",
            title: "「" + entries[i].label + "」的要点未以动词开头：" + line.slice(0, 24) + (line.length > 24 ? "…" : ""),
            detail: "建议以动作动词开头（负责/主导/搭建/优化/推动/独立完成…），体现你的主动性与贡献。",
            section: entries[i].label
          });
        }
        if (containsEmptyPhrase(line)) {
          emptyMiss++;
          items.push({
            severity: "warn", code: "expression",
            title: "「" + entries[i].label + "」出现空话表达：" + line.slice(0, 24) + (line.length > 24 ? "…" : ""),
            detail: "「学习能力强/认真负责/性格开朗」等空话没有信息量，请换成具体事实或删掉。",
            section: entries[i].label
          });
        }
        if (line.length > 70) { longMiss++; if (longMiss <= 3) items.push({ severity: "info", code: "expression", title: "要点过长（" + line.length + " 字）：" + line.slice(0, 20) + "…", detail: "建议拆成 2 条，每条聚焦一个动作+一个结果，方便 HR 快速扫读。", section: entries[i].label }); }
        if (line.length > 0 && line.length < 6) { shortMiss++; if (shortMiss <= 3) items.push({ severity: "info", code: "expression", title: "要点过短：" + line, detail: "太短的要点没有信息量，请补充具体动作与结果。", section: entries[i].label }); }
      }
    }
    if (!evaluated) {
      items.push({ severity: "info", code: "expression", title: "暂无经历内容可评估表达结构", detail: "写完经历后，本项会检查：动词开头、STAR 结构、空话与长度。", section: "经历" });
      return 0;
    }
    var miss = verbMiss + emptyMiss;
    var ratio = Math.max(0, 1 - miss / total);
    var pct = Math.round((1 - miss / total) * 100);
    items.push({
      severity: ratio >= 0.8 ? "info" : "warn", code: "expression",
      title: "表达质量：" + pct + "% 的要点以动作动词开头且无空话（" + (total - miss) + "/" + total + "）",
      detail: "参考 STAR 结构：背景（Situation）→ 任务（Task）→ 行动（Action，动词开头）→ 结果（Result，量化）。",
      section: "经历"
    });
    return Math.round(max * Math.min(1, ratio / 0.85));
  }

  function auditKeywords(resume, template, items, hidden) {
    var max = 20;
    var text = fullText(resume, hidden);
    var tpl = template || T.tech || { keywords: [] };
    var kws = tpl.keywords || [];
    if (kws.length === 0) return max;
    /* 纯拉丁/数字关键词用词边界匹配（避免 github 误命中 Git、https 误命中 HTTP、MySQL 误命中 SQL）；含中文/符号的关键词按子串匹配 */
    function keywordTest(kw) {
      var esc = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if (/^[A-Za-z0-9_]+$/.test(kw)) return new RegExp("\\b" + esc + "\\b", "i").test(text);
      return text.toLowerCase().indexOf(kw.toLowerCase()) >= 0;
    }
    var matched = [], missing = [];
    for (var i = 0; i < kws.length; i++) {
      var kw = kws[i];
      if (keywordTest(kw)) matched.push(kw);
      else missing.push(kw);
    }
    var ratio = Math.min(1, matched.length / 8);
    var score = Math.round(max * ratio);
    if (matched.length < 8) {
      items.push({
        severity: matched.length >= 4 ? "warn" : "error", code: "keywords",
        title: "目标岗位「" + (tpl.name || "技术开发") + "」关键词命中 " + matched.length + " 个，建议补充：" + missing.slice(0, 6).join("、"),
        detail: "很多公司用系统初筛简历（JD 关键词匹配）。把岗位 JD 里的技术栈/能力词自然地写进项目与技能里，但不要编造不属实的内容。",
        section: "关键词"
      });
    } else {
      items.push({ severity: "info", code: "keywords", title: "关键词命中 " + matched.length + " 个，覆盖良好", detail: "继续保持，注意关键词必须真实对应你的经历。", section: "关键词" });
    }
    return score;
  }

  function auditCompleteness(resume, items, hidden) {
    var max = 15;
    var missing = [];
    var b = (resume && resume.basic) || {};
    var t = (resume && resume.target) || {};
    var edu = (resume && resume.education) || [];
    function chk(ok, label) { if (!ok) missing.push(label); }
    chk(hasText(b.name), "姓名");
    chk(hasText(b.phone), "手机号");
    chk(hasText(b.email), "邮箱");
    chk(hasText(b.city), "城市");
    chk(hasText(b.birth), "出生年月");
    chk(hasText(b.gender), "性别");
    chk(hasText(b.website) || hasText(b.github), "个人主页/GitHub");
    if (!isHidden(hidden, "target")) {
      chk(hasText(t.position), "目标岗位");
      chk(hasText(t.salary), "期望薪资");
      chk(hasText(t.availability), "可到岗时间");
    }
    if (!isHidden(hidden, "education")) {
      for (var i = 0; i < edu.length; i++) {
        var e = edu[i] || {};
        chk(hasText(e.school) && hasText(e.major) && hasText(e.degree), "教育背景完整信息（第" + (i + 1) + "条）");
        chk(hasText(e.gpa) || hasText(e.rank), "GPA或排名（第" + (i + 1) + "条）");
      }
    }
    var hasSkill = ((resume && resume.skills) || []).some(function (s) { return hasText(s.category) && hasText(s.items); });
    if (!isHidden(hidden, "skills")) chk(hasSkill, "技能分类与内容");
    if (!isHidden(hidden, "evaluation")) chk(hasText(resume && resume.evaluation), "自我评价");
    var ratio = Math.max(0, 1 - missing.length / 16);
    if (missing.length) {
      items.push({
        severity: missing.length > 5 ? "warn" : "info", code: "completeness",
        title: "可补充的字段（" + missing.length + " 项）：" + missing.slice(0, 8).join("、"),
        detail: "校招简历建议信息完整：出生年月、期望薪资、可到岗时间（毕业时间）、GPA/排名等都是常见考察点。",
        section: "完整度"
      });
    }
    return Math.round(max * ratio);
  }

  /* ---------- 主入口 ---------- */

  /**
   * @param resume 简历数据对象（与编辑器 state 同构）
   * @param templateId 岗位模板 id（如 'tech'），缺省自动选第一个
   * @param opts 可选 { hidden: {板块key: true} } —— 用户隐藏的板块不参与检查
   * @returns { total, passLevel, categories, items, summary }
   */
  function audit(resume, templateId, opts) {
    var items = [];
    var hidden = opts && opts.hidden;
    var template = (templateId && T[templateId]) || T.tech || { name: "技术开发", keywords: [] };

    var hard = auditHard(resume, items, hidden);
    var quantified = auditQuantified(resume, items, hidden);
    var expression = auditExpression(resume, items, hidden);
    var keywords = auditKeywords(resume, template, items, hidden);
    var completeness = auditCompleteness(resume, items, hidden);
    var total = hard + quantified + expression + keywords + completeness;

    var passLevel = total >= 85 ? "优秀" : total >= 70 ? "良好" : total >= 55 ? "待改进" : "需大改";

    /* 自动总结：取最严重的 3 条 */
    var order = { error: 0, warn: 1, info: 2 };
    var top = items.slice().sort(function (a, b) { return order[a.severity] - order[b.severity]; }).slice(0, 3);
    var summary;
    if (items.length === 0) summary = "简历质量很好，继续完善细节即可。";
    else summary = "当前总分 " + total + " 分（" + passLevel + "）。优先处理：" + top.map(function (it) { return it.title; }).join("；") + "。";

    return {
      total: total,
      passLevel: passLevel,
      categories: [
        { key: "hard", name: "硬伤检查", score: hard, max: 30, tip: "姓名/联系方式/教育背景/求职意向等必备项" },
        { key: "quantified", name: "量化与结果", score: quantified, max: 20, tip: "经历要点中数字的占比（目标 80%+）" },
        { key: "expression", name: "表达与结构", score: expression, max: 15, tip: "动词开头、STAR 结构、无空话、长度适中" },
        { key: "keywords", name: "关键词匹配", score: keywords, max: 20, tip: "目标岗位关键词命中情况（系统初筛用）" },
        { key: "completeness", name: "完整度", score: completeness, max: 15, tip: "常用字段是否齐全" }
      ],
      items: items,
      summary: summary
    };
  }

  global.ResumeEngine = {
    audit: audit,
    splitBullets: splitBullets,
    isValidPhone: isValidPhone,
    isValidEmail: isValidEmail,
    startsWithVerb: startsWithVerb,
    containsEmptyPhrase: containsEmptyPhrase,
    fullText: fullText
  };
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* export.js — 导出模块：Markdown / JSON / 单文件备份
 * 依赖全局 RESUME_TEMPLATES。暴露全局 ResumeExport。
 */
(function (global) {
  "use strict";

  function hasText(v) { return typeof v === "string" && v.trim().length > 0; }
  function j(v) { return (v || "").trim(); }

  /* 渲染一段经历内容为 Markdown 列表 */
  function bulletsToMd(content) {
    if (!hasText(content)) return "";
    return content.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean)
      .map(function (l) { return "- " + l; }).join("\n");
  }

  /* 生成 Markdown 简历全文 */
  function toMarkdown(resume, templateId) {
    var tpl = (templateId && global.RESUME_TEMPLATES && global.RESUME_TEMPLATES[templateId]) || null;
    var L = [];
    var b = (resume && resume.basic) || {};
    var t = (resume && resume.target) || {};

    L.push("# " + (b.name || "（姓名）"));
    var contact = [];
    if (hasText(b.phone)) contact.push("电话 " + b.phone);
    if (hasText(b.email)) contact.push("邮箱 " + b.email);
    if (hasText(b.city)) contact.push("城市 " + b.city);
    if (hasText(b.birth)) contact.push("出生 " + b.birth);
    if (hasText(b.website)) contact.push("主页 " + b.website);
    if (hasText(b.github)) contact.push("GitHub " + b.github);
    if (contact.length) L.push("> " + contact.join(" ｜ "));
    L.push("");

    if (hasText(t.position) || hasText(t.industry) || hasText(t.salary)) {
      L.push("## 求职意向");
      L.push("- 目标岗位：" + (t.position || "—"));
      if (hasText(t.industry)) L.push("- 意向行业：" + t.industry);
      if (hasText(t.city)) L.push("- 意向城市：" + t.city);
      if (hasText(t.salary)) L.push("- 期望薪资：" + t.salary);
      if (hasText(t.availability)) L.push("- 可到岗时间：" + t.availability);
      L.push("");
    }

    var edu = (resume && resume.education) || [];
    if (edu.length) {
      L.push("## 教育背景");
      edu.forEach(function (e) {
        var head = [j(e.school), j(e.major), j(e.degree)].filter(Boolean).join(" · ");
        var range = [j(e.start), j(e.end)].filter(Boolean).join(" - ");
        L.push("**" + head + "**" + (range ? "（" + range + "）" : ""));
        var meta = [];
        if (hasText(e.gpa)) meta.push("GPA " + e.gpa);
        if (hasText(e.rank)) meta.push("排名 " + e.rank);
        if (meta.length) L.push("- " + meta.join("；"));
        if (hasText(e.courses)) L.push("- 主修课程：" + e.courses);
        if (hasText(e.honors)) L.push("- 在校荣誉：" + e.honors);
        L.push("");
      });
    }

    function section(title, arr, headFn, bodyFn) {
      if (!arr || !arr.length) return;
      L.push("## " + title);
      arr.forEach(function (it) {
        var head = headFn(it);
        if (head) L.push("### " + head);
        bodyFn(it).forEach(function (line) { if (line) L.push(line); });
        L.push("");
      });
    }

    section("实习经历", (resume && resume.internships) || [],
      function (it) { return [j(it.company), j(it.title)].filter(Boolean).join(" · ") + (hasText(it.start) || hasText(it.end) ? "（" + [j(it.start), j(it.end)].filter(Boolean).join(" - ") + "）" : ""); },
      function (it) { return bulletsToMd(it.content).split("\n"); });

    section("项目经历", (resume && resume.projects) || [],
      function (it) {
        var parts = [j(it.name)];
        if (hasText(it.role)) parts.push("（" + it.role + "）");
        if (hasText(it.tech)) parts.push(" 技术栈：" + it.tech);
        return parts.join("");
      },
      function (it) { return bulletsToMd(it.content).split("\n"); });

    section("校园经历", (resume && resume.campus) || [],
      function (it) { return [j(it.org), j(it.role)].filter(Boolean).join(" · "); },
      function (it) { return bulletsToMd(it.content).split("\n"); });

    section("科研成果", (resume && resume.research) || [],
      function (it) {
        var head = [j(it.kind), j(it.title)].filter(Boolean).join(" · ");
        var meta = [j(it.role), j(it.venue), j(it.date)].filter(Boolean).join(" · ");
        return head + (meta ? "（" + meta + "）" : "");
      },
      function (it) { return bulletsToMd(it.note).split("\n"); });

    var awards = (resume && resume.awards) || [];
    if (awards.length) {
      L.push("## 荣誉奖项");
      awards.forEach(function (a) {
        L.push("- " + [j(a.name), j(a.level), j(a.date)].filter(Boolean).join(" · "));
      });
      L.push("");
    }

    var skills = (resume && resume.skills) || [];
    if (skills.length) {
      L.push("## 技能");
      skills.forEach(function (s) {
        if (hasText(s.category) || hasText(s.items)) {
          L.push("- " + (s.category ? "**" + s.category + "**：" : "") + (s.items || ""));
        }
      });
      L.push("");
    }

    if (hasText(resume && resume.evaluation)) {
      L.push("## 自我评价");
      L.push(resume.evaluation.trim());
      L.push("");
    }
    if (hasText(resume && resume.extra)) {
      L.push("## 其他");
      L.push(resume.extra.trim());
    }

    return L.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
  }

  function toJSON(payload) {
    return JSON.stringify(Object.assign({ app: "resume-kit", version: 2, exportedAt: new Date().toISOString() }, payload), null, 2);
  }

  /* 浏览器端下载辅助（无 DOM 环境自动跳过；无 createObjectURL 时退化为 data: URL） */
  function download(filename, content, mime) {
    if (typeof document === "undefined") return;
    var a = document.createElement("a");
    a.download = filename;
    try {
      if (typeof URL !== "undefined" && typeof URL.createObjectURL === "function" && typeof Blob !== "undefined") {
        var blob = new Blob([content], { type: (mime || "text/plain") + ";charset=utf-8" });
        var url = URL.createObjectURL(blob);
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
        return;
      }
    } catch (e) { /* fall through to data: URL */ }
    a.href = "data:" + (mime || "text/plain") + ";charset=utf-8," + encodeURIComponent(content);
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); }, 100);
  }

  /* 导出便携版单文件 HTML：把当前数据注入到单文件模板中
   * 注入点必须是 <head> 之后、业务脚本之前的注释锚点（build.js 生成），
   * 这样 app.js 启动时就能读到 __RESUME_KIT_BOOT_DATA__。
   */
  function buildPortableHTML(singleFileHTML, resume) {
    var anchor = "<!--__RESUME_KIT_DATA__-->";
    var marker = "window.__RESUME_KIT_BOOT_DATA__";
    var payload = JSON.stringify({ app: "resume-kit", version: 1, exportedAt: new Date().toISOString(), resume: resume })
      .replace(/</g, "\\u003c");
    var script = "\n<script>\n" + marker + " = " + payload + ";\n<\/script>";
    if (singleFileHTML.indexOf(anchor) >= 0) return singleFileHTML.replace(anchor, script);
    return singleFileHTML.replace(/<head>/i, "<head>" + script);
  }

  /* 解析便携版注入数据（不存在返回 null） */
  function parseBootData() {
    if (typeof window !== "undefined" && window.__RESUME_KIT_BOOT_DATA__) {
      var d = window.__RESUME_KIT_BOOT_DATA__;
      if (d && d.resume) return d.resume;
    }
    return null;
  }

  global.ResumeExport = {
    toMarkdown: toMarkdown,
    toJSON: toJSON,
    download: download,
    buildPortableHTML: buildPortableHTML,
    parseBootData: parseBootData
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ai.js — 可选 DeepSeek AI 优化模块（本地规则之外的增强功能）
 * API Key 仅保存在浏览器 localStorage，不经过任何第三方服务器。
 * 暴露全局 ResumeAI。
 */
(function (global) {
  "use strict";

  var STORAGE_KEY = "resumeKit:ai";
  var DEFAULT_BASE = "https://api.deepseek.com";
  var DEFAULT_MODEL = "deepseek-chat";

  /* ---------- 配置存取 ---------- */

  function loadConfig() {
    try {
      var raw = global.localStorage && global.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var c = JSON.parse(raw);
        if (c && c.key) return { key: c.key, base: c.base || DEFAULT_BASE, model: c.model || DEFAULT_MODEL };
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function saveConfig(cfg) {
    try {
      global.localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    } catch (e) { /* ignore */ }
  }

  /* ---------- 调用 DeepSeek ---------- */

  /**
   * @param messages [{role, content}]
   * @param cfg {key, base, model}
   * @returns 模型返回文本
   */
  async function chat(messages, cfg, signal) {
    var base = (cfg && cfg.base) || DEFAULT_BASE;
    var model = (cfg && cfg.model) || DEFAULT_MODEL;
    var key = cfg && cfg.key;
    if (!key) throw new Error("未配置 API Key，请先在「AI 优化」面板中填写。");

    var resp = await fetch(base.replace(/\/+$/, "") + "/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key
      },
      body: JSON.stringify({
        model: model,
        messages: messages,
        temperature: 0.6,
        stream: false
      }),
      signal: signal
    });
    if (!resp.ok) {
      var detail = "";
      try { detail = (await resp.json()).error && (await resp.json()).error.message; } catch (e) { /* ignore */ }
      throw new Error("API 请求失败（HTTP " + resp.status + "）" + (detail ? "：" + detail : ""));
    }
    var data = await resp.json();
    var text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!text) throw new Error("API 返回内容为空，请重试。");
    return text.trim();
  }

  /* ---------- 提示词与业务方法 ---------- */

  var SYSTEM_HR = "你是一位深耕校招 10 年的资深 HR 兼简历顾问，熟悉国内互联网大厂、国企、银行的校招简历筛选标准。你的任务不是把话写漂亮，而是帮助候选人把真实经历写清楚、写具体、写得更像能过筛选的简历。必须遵守：1）不编造任何事实、数字、头衔、职责；2）如果材料不足，要明确指出需要补充什么；3）优先强调动作、交付物、结果、影响范围；4）如果给了 JD，就按 JD 调整重点；5）回答全部用中文，直接、可执行、不空泛。";

  function compactResume(resume) {
    // 传给模型的简历压缩文本（去掉 photo 等无关字段）
    var fields = ["basic", "target", "education", "internships", "projects", "campus", "awards", "skills", "evaluation", "extra"];
    var out = {};
    fields.forEach(function (k) { if (resume && resume[k] !== undefined) out[k] = resume[k]; });
    if (out.basic) delete out.basic.photo;
    var s = JSON.stringify(out);
    return s.length > 6000 ? s.slice(0, 6000) + "…（内容过长已截断）" : s;
  }

  /**
   * 整体优化建议：针对简历与目标岗位给出 5-8 条具体改进意见。
   */
  function aiSuggest(resume, template, cfg, signal, jdText) {
    var tplName = template && template.name ? template.name : "未指定岗位";
    return chat([
      { role: "system", content: SYSTEM_HR },
      { role: "user", content:
        "以下是某应届生的简历数据（JSON）与目标岗位：\n目标岗位：" + tplName + "\n简历：\n" + compactResume(resume) +
        (jdText ? "\n\n目标 JD：\n" + String(jdText).slice(0, 2500) : "") +
        "\n\n请先判断这份简历最影响投递的 3-4 个问题，再给修改建议。重点看：①经历是否写清楚做了什么 ②有没有结果和量化 ③有没有空话或堆职责 ④和目标岗位/JD 是否匹配。输出要尽量短，方便直接照着改。格式固定为：1. 问题：...｜修改：...｜示例：...。每条控制在 3 行内，不要写长解释，不要客套话。" }
    ], cfg, signal);
  }

  /**
   * 岗位定向改写：按目标岗位的关键词与写法要求，输出各经历板块的改写示例。
   */
  function aiRewrite(resume, template, cfg, signal, jdText) {
    var tplName = template && template.name ? template.name : "未指定岗位";
    var kws = template && template.keywords ? template.keywords.slice(0, 12).join("、") : "（未提供关键词）";
    return chat([
      { role: "system", content: SYSTEM_HR },
      { role: "user", content:
        "以下是某应届生的简历数据（JSON）：\n" + compactResume(resume) +
        "\n\n目标岗位：" + tplName + "，该岗位高频关键词：" + kws +
        (jdText ? "\n目标 JD：\n" + String(jdText).slice(0, 2500) : "") +
        "\n\n请把这份简历改成更适合投递的版本。规则：1）保留真实事实，不编造；2）优先改写实习和项目；3）每条经历都尽量写成“动作 + 结果”；4）如果没有数字，不要硬编，可以保留“建议补充数据”；5）如果给了 JD，优先保留与 JD 强相关的内容，弱相关内容可删减。输出必须简洁：每条经历以「【实习1】【实习2】【项目1】…」开头，下面只保留 2-4 条要点，每条一行，不要解释。" }
    ], cfg, signal);
  }

  /**
   * 润色单条经历：返回改写后的要点文本。
   */
  function aiPolish(entryTitle, content, contextText, cfg, signal) {
    return chat([
      { role: "system", content: SYSTEM_HR },
      { role: "user", content:
        "请把下面这段经历改得更像一条能投递的简历内容。要求：动词开头、每条一行、少空话、尽量体现动作和结果。只能改写表达，不得编造事实与数字；如果原文缺少结果或数字，可以用“（建议补充结果/数据）”提醒，但不要乱写。\n经历名称：" + entryTitle +
        (contextText ? "\n相关背景（目标岗位/技术栈）：" + contextText : "") +
        "\n原文：\n" + content +
        "\n\n直接输出 2-4 条改写后的要点，每条一行，不要解释，不要标题，不要 markdown 代码块。" }
    ], cfg, signal);
  }

  function aiDiagnose(resume, template, cfg, signal, jdText) {
    var tplName = template && template.name ? template.name : "未指定岗位";
    return chat([
      { role: "system", content: SYSTEM_HR },
      { role: "user", content:
        "请你先作为简历诊断顾问，而不是改写器。下面是一份应届生简历 JSON：\n" + compactResume(resume) +
        "\n\n目标岗位：" + tplName +
        (jdText ? "\n目标 JD：\n" + String(jdText).slice(0, 2500) : "") +
        "\n\n请输出简短、可直接执行的结果，共 3 个部分：\n" +
        "1. 【最先改的3点】列出最影响投递的 3 条问题；\n" +
        "2. 【还缺什么】列出 3-5 个最值得补充的事实；\n" +
        "3. 【下一步怎么做】用 2-3 句话说明先补哪段经历、再怎么改。\n\n" +
        "要求：不要长篇分析；不要直接生成整份新简历；不要编造；如果材料不足，要直接说“这段先补事实再改写”。" }
    ], cfg, signal);
  }

  function aiPolishWithFacts(entryTitle, content, factsText, contextText, cfg, signal, jdText) {
    return chat([
      { role: "system", content: SYSTEM_HR },
      { role: "user", content:
        "请把下面这段经历优化成更适合投递的简历要点。要求：动词开头、每条一行、突出你的贡献、结果优先、尽量量化；绝对不要编造事实。\n" +
        "经历名称：" + entryTitle +
        (contextText ? "\n目标岗位背景：" + contextText : "") +
        (jdText ? "\n目标 JD：\n" + String(jdText).slice(0, 1800) : "") +
        "\n原始经历：\n" + content +
        (factsText ? "\n\n用户补充事实：\n" + factsText : "") +
        "\n\n请直接输出最终可放进简历的 2-4 条要点，每条一行，不要解释，不要标题，不要 markdown 代码块。优先把用户补充的事实融进结果和职责表达里。" }
    ], cfg, signal);
  }

  /* 清理模型输出：去代码块围栏与前后缀 */

 color: var(--danger); }\n.sev-tag.warn { background: rgba(217, 119, 6, .12); color: var(--warn); }\n.sev-tag.info { background: var(--accent-weak); color: var(--accent); }\n.jd-evidence-card {\n  margin: 14px 0; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;\n}\n.jd-evidence-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }\n.jd-evidence-head h3 { margin: 0; font-size: 15px; }\n.jd-evidence-head span { font-size: 12px; color: var(--text-2); }\n.jd-group + .jd-group { margin-top: 12px; }\n.jd-group-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }\n.jd-group-note { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }\n.jd-evidence-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }\n.jd-chip { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg); }\n.jd-chip.strong { border-color: rgba(5, 150, 105, .22); background: rgba(5, 150, 105, .03); }\n.jd-chip.weak { border-color: rgba(217, 119, 6, .20); background: rgba(217, 119, 6, .04); }\n.jd-chip-key { font-size: 13px; font-weight: 700; margin-bottom: 8px; }\n.jd-chip-body { display: flex; flex-direction: column; gap: 8px; }\n.jd-hit { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }\n.jd-hit-snippet { font-size: 12px; color: var(--text-2); margin-top: 4px; line-height: 1.6; }\n.jd-suggest-box { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }\n.jd-suggest-title { font-size: 12px; font-weight: 700; color: var(--warn); margin-bottom: 6px; }\n.jd-suggest-item + .jd-suggest-item { margin-top: 8px; }\n.jd-missing { margin-top: 12px; font-size: 12.5px; color: var(--text-2); }\n.jd-missing.ok { color: var(--ok); }\n.jd-miss-tag {\n  display: inline-flex; align-items: center; margin: 4px 6px 0 0; padding: 2px 8px; border-radius: 999px;\n  background: rgba(217, 119, 6, .10); color: var(--warn); font-size: 11px; font-weight: 600;\n}\n.link-btn {\n  border: none; background: transparent; color: var(--accent); padding: 0; cursor: pointer; font: inherit; font-weight: 600; text-align: left;\n}\n.link-btn:hover { text-decoration: underline; }\n\n/* ========== 求职台 ========== */\n.job-layout { display: grid; grid-template-columns: 300px 1fr 320px; gap: 14px; padding: 16px 20px 60px; align-items: start; }\n.job-col {\n  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;\n  padding: 14px 16px;\n}\n.job-col h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\n.timeline { display: flex; flex-direction: column; gap: 10px; }\n.tl-item { display: flex; gap: 10px; }\n.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }\n.tl-item.future .tl-dot { background: var(--border-strong); }\n.tl-body { flex: 1; min-width: 0; }\n.tl-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }\n.tl-stage { font-weight: 700; }\n.tl-time { font-size: 11px; color: var(--text-2); }\n.tl-note { font-size: 12px; color: var(--text-2); margin-top: 2px; }\n.app-table-wrap { overflow: auto; max-height: 60vh; }\ntable.app-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }\n.app-table th, .app-table td {\n  border-bottom: 1px solid var(--border); padding: 7px 8px; text-align: left; vertical-align: middle;\n}\n.app-table th { color: var(--text-2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; background: var(--bg-panel); }\n.app-table td input, .app-table td select {\n  font-family: inherit; font-size: 12.5px; color: var(--text);\n  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; width: 100%;\n}\n.status-pill { font-size: 11px; padding: 2px 9px; border-radius: 10px; font-weight: 600; white-space: nowrap; }\n.st-待投递 { background: var(--bg-hover); color: var(--text-2); }\n.st-已投递 { background: var(--accent-weak); color: var(--accent); }\n.st-笔试 { background: rgba(139, 92, 246, .14); color: #8b5cf6; }\n.st-面试中 { background: rgba(217, 119, 6, .14); color: var(--warn); }\n.st-Offer { background: rgba(5, 150, 105, .14); color: var(--ok); }\n.st-已拒绝 { background: rgba(220, 38, 38, .1); color: var(--danger); }\n.st-放弃 { background: var(--bg-hover); color: var(--text-2); }\n.checklist { display: flex; flex-direction: column; gap: 6px; }\n.cl-group { margin-bottom: 6px; }\n.cl-group-title { font-size: 12px; font-weight: 700; color: var(--text-2); margin: 8px 0 4px; }\n.cl-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; padding: 3px 0; }\n.cl-item input { margin-top: 4px; accent-color: var(--accent); }\n.cl-item.done { color: var(--text-2); text-decoration: line-through; }\n.check-progress { font-size: 12px; color: var(--text-2); font-weight: 400; }\n\n/* ========== AI 页 ========== */\n.ai-body { padding: 16px 20px 60px; max-width: 860px; margin: 0 auto; }\n.ai-card {\n  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;\n  padding: 16px 18px; margin-bottom: 14px;\n}\n.ai-card h3 { margin: 0 0 10px; font-size: 15px; }\n.ai-config { display: flex; flex-direction: column; gap: 10px; }\n.ai-config .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }\n.ai-config input {\n  font-family: inherit; font-size: 13px; color: var(--text); background: var(--bg);\n  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; flex: 1; min-width: 200px;\n}\n.ai-guide {\n  background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;\n}\n.ai-guide-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; }\n.ai-guide-steps { display: flex; gap: 8px; flex-wrap: wrap; }\n.ai-guide-steps span {\n  display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px; background: var(--bg-panel); border: 1px solid var(--border); font-size: 12px; color: var(--text-2);\n}\n.ai-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }\n.ai-result {\n  margin-top: 12px; background: var(--bg); border: 1px solid var(--border);\n  border-radius: 10px; padding: 12px 14px; font-size: 13px; white-space: pre-wrap;\n  max-height: 420px; overflow: auto; line-height: 1.8;\n}\n.ai-result.loading { color: var(--text-2); }\n.ai-result .err { color: var(--danger); }\n.ai-toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }\n.ai-note { font-size: 12px; color: var(--text-2); margin-top: 8px; }\n.ai-polish-select { font-family: inherit; font-size: 13px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }\n.fact-card { display: flex; flex-direction: column; gap: 10px; }\n.fact-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg); }\n.fact-label { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }\n.fact-question { font-size: 13px; margin-bottom: 8px; }\n.fact-answer {\n  width: 100%; min-height: 82px; resize: vertical; font-family: inherit; font-size: 13px;\n  color: var(--text); background: var(--bg-panel); border: 1px solid var(--border);\n  border-radius: 8px; padding: 8px 10px;\n}\n.fact-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }\n\n/* ========== 弹窗 / Toast ========== */\n.modal-mask {\n  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 100;\n  display: flex; align-items: center; justify-content: center; padding: 20px;\n}\n.modal {\n  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px;\n  box-shadow: var(--shadow); width: min(560px, 100%); max-height: 86vh;\n  display: flex; flex-direction: column; overflow: hidden;\n}\n.modal-head {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 12px 18px; border-bottom: 1px solid var(--border); font-weight: 700;\n}\n.modal-close { border: none; background: transparent; color: var(--text-2); font-size: 18px; cursor: pointer; }\n.modal-body { padding: 16px 18px; overflow: auto; font-size: 13.5px; }\n.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border); }\n.toast-root { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }\n.toast {\n  background: var(--bg-panel); border: 1px solid var(--border); border-left: 4px solid var(--accent);\n  border-radius: 10px; padding: 10px 16px; font-size: 13px; box-shadow: var(--shadow);\n  max-width: 340px; animation: toast-in .2s ease-out;\n}\n.toast.ok { border-left-color: var(--ok); }\n.toast.err { border-left-color: var(--danger); }\n@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }\n\n/* ========== 打印 ========== */\n.print-only { display: none; }\n@media print {\n  @page { size: A4; margin: 12mm 14mm; }\n  html, body { margin: 0; padding: 0; background: #fff; }\n  body { background: #fff; }\n  body > #app { display: none !important; }\n  #printArea { display: block !important; margin: 0; padding: 0; }\n  #printArea .page {\n    width: auto; min-height: auto; box-shadow: none; margin: 0;\n    padding: 0; gap: 16px; overflow: visible;\n    break-inside: auto; page-break-inside: auto;\n  }\n  #printArea .page.compact-page {\n    gap: 12px;\n  }\n  /* When one-page compression was requested, make print pagination match the compact preview. */\n  body.print-fit-requested #printArea .page {\n    zoom: var(--print-fit-scale, 0.94);\n  }\n}\n\n\u003c/style>\n\u003c!--__RESUME_KIT_DATA__-->\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\" class=\"app\">\n  \u003cheader class=\"topbar\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\">📄\u003c/span> ResumeCraft \u003cspan class=\"badge\">校招版\u003c/span>\u003cspan id=\"buildBadge\" class=\"badge ghost-badge\">Build\u003c/span>\u003c/div>\n    \u003cdiv class=\"topbar-actions\">\n      \u003cspan id=\"saveStatus\" class=\"save-status\">\u003c/span>\n      \u003cbutton id=\"btnTheme\" class=\"btn ghost\" title=\"切换明暗主题\">🌓\u003c/button>\n      \u003cbutton id=\"btnImport\" class=\"btn ghost\" title=\"从 JSON 文件恢复简历\">导入\u003c/button>\n      \u003cbutton id=\"btnBackup\" class=\"btn ghost\" title=\"导出含当前数据的单文件 HTML 备份\">备份下载\u003c/button>\n      \u003cbutton id=\"btnPrint\" class=\"btn primary\">打印 / 导出 PDF\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cnav class=\"tabs\" id=\"tabs\">\n    \u003cbutton data-tab=\"edit\" class=\"tab active\">✏️ 简历编辑\u003c/button>\n    \u003cbutton data-tab=\"preview\" class=\"tab\">👁 简历预览\u003c/button>\n    \u003cbutton data-tab=\"audit\" class=\"tab\">🩺 简历体检\u003c/button>\n    \u003cbutton data-tab=\"job\" class=\"tab\">🎯 求职台\u003c/button>\n    \u003cbutton data-tab=\"ai\" class=\"tab\">✨ AI 优化\u003c/button>\n  \u003c/nav>\n  \u003cmain class=\"main\">\n    \u003csection id=\"tab-edit\" class=\"tab-panel active\">\n      \u003cdiv class=\"edit-layout\">\n        \u003cdiv class=\"form-pane\" id=\"formPane\">\u003c/div>\n        \u003cdiv class=\"mini-preview\">\n          \u003cdiv class=\"mini-preview-head\">\n            \u003cspan>实时预览\u003c/span>\n            \u003cbutton id=\"btnGoPreview\" class=\"btn small ghost\">全屏预览 →\u003c/button>\n          \u003c/div>\n          \u003cdiv id=\"miniPreviewBody\" class=\"mini-preview-body\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003csection id=\"tab-preview\" class=\"tab-panel\">\n      \u003cdiv class=\"preview-toolbar\">\n        \u003clabel>岗位模板\n          \u003cselect id=\"templateSelect\">\u003c/select>\n        \u003c/label>\n        \u003clabel>简历风格\n          \u003cselect id=\"styleSelect\">\u003c/select>\n        \u003c/label>\n        \u003clabel>版本策略\n          \u003cselect id=\"variantSelect\">\u003c/select>\n        \u003c/label>\n        \u003cbutton id=\"btnFillSample\" class=\"btn ghost\" title=\"按所选岗位模板填入示例内容（标注「示例，请替换」）\">填入岗位示例\u003c/button>\n        \u003cbutton id=\"btnPageCheck\" class=\"btn ghost\" title=\"检查当前内容是否可能超过一页，并给出手动精简建议\">一页检查\u003c/button>\n        \u003cbutton id=\"btnCompareVersions\" class=\"btn ghost\" title=\"对比完整版与当前 JD/投递版本的差异\">对比完整版 vs JD版\u003c/button>\n        \u003cspan class=\"spacer\">\u003c/span>\n        \u003cbutton id=\"btnPrint2\" class=\"btn primary\">打印 / 导出 PDF\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"previewCompare\" class=\"preview-compare\">\u003c/div>\n      \u003cdiv id=\"previewBody\" class=\"preview-body\">\u003c/div>\n    \u003c/section>\n    \u003csection id=\"tab-audit\" class=\"tab-panel\">\n      \u003cdiv class=\"audit-head\">\n        \u003cbutton id=\"btnAudit\" class=\"btn primary big\">🩺 开始体检\u003c/button>\n        \u003cspan id=\"auditSummary\" class=\"audit-summary\">\u003c/span>\n        \u003cspan class=\"spacer\">\u003c/span>\n        \u003cbutton id=\"btnCopyReport\" class=\"btn ghost\">复制体检报告\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"auditBody\" class=\"audit-body\">\u003c/div>\n    \u003c/section>\n    \u003csection id=\"tab-job\" class=\"tab-panel\">\n      \u003cdiv class=\"job-layout\">\n        \u003cdiv class=\"job-col\">\n          \u003ch3>📅 校招时间线\u003c/h3>\n          \u003cdiv id=\"timeline\" class=\"timeline\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"job-col job-col-wide\">\n          \u003ch3>📋 投递记录\n            \u003cbutton id=\"btnAddApp\" class=\"btn small\">+ 添加\u003c/button>\n            \u003cbutton id=\"btnExportApps\" class=\"btn small ghost\">导出 CSV\u003c/button>\n          \u003c/h3>\n          \u003cdiv id=\"appTableWrap\" class=\"app-table-wrap\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"job-col\">\n          \u003ch3>✅ 准备清单 \u003cspan id=\"checkProgress\" class=\"check-progress\">\u003c/span>\u003c/h3>\n          \u003cdiv id=\"checklist\" class=\"checklist\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003csection id=\"tab-ai\" class=\"tab-panel\">\n      \u003cdiv id=\"aiBody\" class=\"ai-body\">\u003c/div>\n    \u003c/section>\n  \u003c/main>\n  \u003cdiv id=\"modalRoot\">\u003c/div>\n  \u003cdiv id=\"toastRoot\" class=\"toast-root\">\u003c/div>\n\u003c/div>\n\u003cdiv id=\"printArea\" class=\"print-only\">\u003c/div>\n\u003cscript>\n/* templates.js — 校招岗位模板（技术/产品/运营/市场/设计/职能）与示例库\n * 纯数据模块，不依赖 DOM。暴露全局 RESUME_TEMPLATES。\n */\n(function (global) {\n  \"use strict\";\n\n  /* 通用动词库：用于 STAR/动词 检查 */\n  var ACTION_VERBS = [\n    \"负责\", \"主导\", \"参与\", \"独立\", \"组织\", \"搭建\", \"设计\", \"开发\", \"优化\",\n    \"推动\", \"协调\", \"撰写\", \"完成\", \"实现\", \"带领\", \"策划\", \"运营\", \"分析\",\n    \"制定\", \"执行\", \"落地\", \"复盘\", \"维护\", \"重构\", \"调研\", \"产出\", \"对接\",\n    \"跟进\", \"管理\", \"处理\", \"构建\", \"封装\", \"编写\", \"测试\", \"部署\", \"上线\",\n    \"推广\", \"转化\", \"提升\", \"降低\", \"缩短\", \"提高\", \"增长\", \"覆盖\", \"触达\",\n    \"服务\", \"支持\", \"梳理\", \"整合\", \"打通\", \"建模\", \"训练\", \"调优\", \"评测\",\n    \"采集\", \"清洗\", \"可视化\", \"定位\", \"解决\", \"修复\", \"排查\", \"监控\", \"告警\",\n    \"沉淀\", \"总结\", \"输出\", \"宣讲\", \"谈判\", \"核算\", \"编制\", \"招聘\", \"培训\",\n    \"选拔\", \"接待\", \"策划\", \"剪辑\", \"拍摄\", \"绘制\", \"排版\", \"制定\", \"走访\",\n    \"调研\", \"调研\", \"答辩\", \"汇报\", \"答辩\", \"配合\", \"协助\", \"支撑\", \"供给\",\n    \"建模\", \"竞品\", \"需求\", \"原型\", \"评审\", \"迭代\", \"上线\", \"灰度\", \"召回\"\n  ];\n\n  /* 空话检测库：自我评价/经历中的\"无效表达\" */\n  var EMPTY_PHRASES = [\n    \"学习能力强\", \"吃苦耐劳\", \"性格开朗\", \"认真负责\", \"抗压能力强\",\n    \"沟通能力强\", \"团队合作精神\", \"积极主动\", \"责任心强\", \"适应能力强\",\n    \"乐于助人\", \"热爱学习\", \"踏实肯干\", \"勤奋好学\", \"诚实守信\"\n  ];\n\n  function mergeKeywords(base, extra) {\n    var seen = Object.create(null);\n    var out = [];\n    (base || []).concat(extra || []).forEach(function (kw) {\n      if (!kw || seen[kw]) return;\n      seen[kw] = true;\n      out.push(kw);\n    });\n    return out;\n  }\n\n  function cloneTemplate(src, patch) {\n    var base = JSON.parse(JSON.stringify(src));\n    var next = Object.assign(base, patch || {});\n    if (patch && patch.tips) next.tips = Object.assign({}, base.tips || {}, patch.tips);\n    if (patch && patch.keywords) next.keywords = mergeKeywords(base.keywords || [], patch.keywords);\n    return next;\n  }\n\n  /* 六类校招岗位模板 + 互联网细分模板 */\n  var TEMPLATES = {\n    tech: {\n      id: \"tech\",\n      name: \"技术开发\",\n      desc: \"后端 / 前端 / 算法 / 测试 / 客户端\",\n      keywords: [\n        \"Java\", \"Python\", \"C++\", \"Go\", \"JavaScript\", \"TypeScript\", \"React\", \"Vue\",\n        \"Spring\", \"MySQL\", \"Redis\", \"Linux\", \"Git\", \"Docker\", \"K8s\", \"Kubernetes\",\n        \"算法\", \"数据结构\", \"高并发\", \"分布式\", \"微服务\", \"消息队列\", \"Kafka\",\n        \"机器学习\", \"深度学习\", \"TensorFlow\", \"PyTorch\", \"LLM\", \"大模型\", \"NLP\",\n        \"Hadoop\", \"Spark\", \"Flink\", \"SQL\", \"测试\", \"自动化\", \"CI/CD\", \"HTTP\",\n        \"TCP/IP\", \"操作系统\", \"计算机网络\", \"设计模式\", \"RESTful\", \"WebSocket\"\n      ],\n      sectionOrder: [\"basic\", \"target\", \"education\", \"internship\", \"project\", \"research\", \"award\", \"skill\", \"evaluation\"],\n      tips: {\n        education: \"技术岗看重：院校层次、GPA/排名、核心专业课（数据结构、操作系统、计算机网络、数据库）、竞赛获奖。建议补全 GPA 与排名。\",\n        internship: \"每一条经历遵循「技术动作 + 规模 + 结果」：用了什么技术栈，解决了什么问题，性能/吞吐/准确率提升了多少。\",\n        project: \"项目是技术简历的核心。写清楚：背景与目标、你负责的模块、技术选型与难点、量化结果（QPS、耗时、准确率、用户量）。避免只列技术名词。\",\n        skill: \"按「语言 / 框架 / 工具 / 其他」分类，写「熟练」「掌握」「了解」三级，不要写「精通」除非有把握。\",\n        evaluation: \"不要写空话。写 2-3 条与岗位相关的硬事实：如「独立完成 3 个上线项目」「LeetCode 300+」「开源社区贡献」。\"\n      },\n      sampleProject: {\n        name: \"校园二手交易平台（示例，请替换）\",\n        role: \"后端开发（负责人）\",\n        tech: \"Spring Boot + MySQL + Redis + Nginx\",\n        content: \"负责平台后端整体架构设计与开发，独立完成用户、商品、订单、支付四个核心模块。\\n针对高并发秒杀场景，使用 Redis 预扣库存 + 消息队列异步削峰，将下单接口 P99 延迟从 800ms 降至 120ms。\\n使用索引优化与分页缓存，接口平均响应时间降低 45%，支撑 5000+ 注册用户、日均 2000 次访问。\"\n      },\n      sampleInternship: {\n        company: \"XX科技有限公司（示例，请替换）\",\n        title: \"后端开发实习生\",\n        content: \"参与电商后台订单系统的开发与维护，负责订单查询接口的重构，使用缓存与索引优化使查询耗时降低 60%。\\n编写单元测试 40+ 个，覆盖率从 30% 提升至 75%，参与 CI/CD 流水线搭建，发布频率从每周 1 次提升到每天 3 次。\"\n      }\n    },\n\n    product: {\n      id: \"product\",\n      name: \"产品经理\",\n      desc: \"产品 / 产品运营 / 用户研究\",\n      keywords: [\n        \"需求分析\", \"需求文档\", \"PRD\", \"原型\", \"Axure\", \"Figma\", \"用户调研\",\n        \"数据分析\", \"SQL\", \"埋点\", \"A/B测试\", \"增长\", \"留存\", \"转化率\",\n        \"竞品分析\", \"市场调研\", \"用户画像\", \"产品规划\", \"迭代\", \"灰度\",\n        \"Roadmap\", \"MVP\", \"用户体验\", \"流程图\", \"思维导图\", \"Xmind\",\n        \"OKR\", \"项目管理\", \"跨部门\", \"协作\", \"复盘\"\n      ],\n      sectionOrder: [\"basic\", \"target\", \"education\", \"internship\", \"project\", \"campus\", \"research\", \"award\", \"skill\", \"evaluation\"],\n      tips: {\n        education: \"产品岗看重：逻辑表达、数据敏感度、商业 sense。如有相关课程（用户研究、市场营销）或数据分析工具（SQL/Excel）学习经历可列出。\",\n        internship: \"用「发现问题 → 方案 → 数据结果」的结构写：你发现了什么用户痛点，做了什么方案，数据（转化率/留存/时长）变化多少。产品经历最忌只写「跟进需求」。\",\n        project: \"可以是课程项目、竞赛、个人 Side Project 甚至复盘一个 App。重点是体现产品思维闭环：调研、定位、方案、验证、数据。\",\n        skill: \"工具类：Axure/Figma/ProcessOn/SQL/Excel 透视表。能力类：需求分析、数据分析、项目管理，用事例佐证而非空泛罗列。\",\n        evaluation: \"突出数据敏感与逻辑表达，用具体事例说明，例如「在校期间主导 2 次 200+ 人规模的活动策划」。\"\n      },\n      sampleProject: {\n        name: \"校园拼车小程序（示例，请替换）\",\n        role: \"产品负责人\",\n        tech: \"Figma + 问卷星 + 微信小程序\",\n        content: \"发现校园跨校区通勤痛点，通过 120 份问卷 + 10 人次深度访谈完成需求调研，输出用户画像与需求优先级。\\n独立完成信息架构、流程图与 40+ 页高保真原型，组织 3 轮可用性测试，根据反馈优化 15 处交互细节。\\n推动小程序上线，2 个月累计注册用户 800+，周活跃率 35%，完成 300+ 次拼车匹配。\"\n      },\n      sampleInternship: {\n        company: \"XX互联网公司（示例，请替换）\",\n        title: \"产品实习生\",\n        content: \"负责新用户引导流程的改版，通过漏斗分析定位 3 个流失环节，输出 2 版优化方案并推动 A/B 测试，注册转化率提升 1 ");\n    } else {\n      hidden[key] = true;\n      toast(\"已隐藏「\" + def.title + \"」（数据保留，可在板块管理中恢复）\", \"ok\");\n    }\n    renderForm(); schedulePreview(); saveState(true);\n  }\n\n  function resetSections() {\n    var tpl = T[state.templateId] || T.tech;\n    state.sections = { order: templateOrder(tpl), hidden: {} };\n    renderForm(); schedulePreview(); saveState(true);\n    toast(\"已恢复「\" + tpl.name + \"」模板的默认板块顺序与显示\", \"ok\");\n  }\n\n  /* ---------- 预览渲染 ---------- */\n\n  function roleClass(templateId) {\n    var id = String(templateId || \"tech\");\n    if ([\"tech\", \"backend\", \"frontend\", \"ai\", \"data\"].indexOf(id) >= 0) return \"role-tech\";\n    if (id === \"product\") return \"role-product\";\n    if (id === \"internet\") return \"role-internet\";\n    if (id === \"operation\") return \"role-operation\";\n    if (id === \"market\") return \"role-market\";\n    if (id === \"design\") return \"role-design\";\n    if (id === \"function\") return \"role-function\";\n    return \"role-tech\";\n  }\n\n  function renderResumeHTML() {\n    var r = deriveResumeVariant(state.variant);\n    var tpl = T[state.templateId] || T.tech;\n    var order = sectionOrder();\n    var hidden = (state.sections && state.sections.hidden) || {};\n    var map = {\n      target: secTarget, education: secEducation,\n      internships: secInternship, projects: secProject, campus: secCampus,\n      research: secResearch,\n      awards: secAward, skills: secSkill, evaluation: secEvaluation, extra: secExtra\n    };\n    var body = order.map(function (k) {\n      if (hidden[k] || !map[k]) return \"\";\n      return map[k](r, tpl);\n    }).filter(Boolean).join(\"\");\n    var photo = hasText(r.basic.photo) ? '\u003cimg class=\"p-photo\" src=\"' + esc(r.basic.photo) + '\" alt=\"\">' : \"\";\n    return '\u003cdiv class=\"page ' + esc(state.style) + ' ' + esc(roleClass(state.templateId)) + (state.compactMode ? ' compact-page' : '') + '\">' +\n      '\u003cheader class=\"p-header\"> ) lines.push('\u003cdiv class=\"p-edu-line\">' + meta.join(\" ｜ \") + \"\u003c/div>\");\n      if (hasText(e.courses)) lines.push('\u003cdiv class=\"p-edu-line\">主修课程：' + esc(e.courses) + \"\u003c/div>\");\n      if (hasText(e.honors)) lines.push('\u003cdiv class=\"p-edu-line\">在校荣誉：' + esc(e.honors) + \"\u003c/div>\");\n      return '\u003cdiv class=\"p-item\">\u003cdiv class=\"p-edu-row\">\u003cspan class=\"p-edu-main\">' + head + \"\u003c/span>\" +\n        '\u003cspan class=\"p-edu-meta\">' + (range ? range : \"\") + \"\u003c/span>\u003c/div>\" + lines.join(\"\") + \"\u003c/div>\";\n    });\n    return secWrap(\"教育背景\", \"EDUCATION\", items.join(\"\"));\n  }\n\n  function bulletsHTML(content) {\n    var lines = String(content || \"\").split(/\\r?\\n/).map(function (l) { return l.trim(); }).filter(Boolean);\n    if (!lines.length) return \"\";\n    return '\u003cul class=\"p-bullets\">' + lines.map(function (l) { return \"\u003cli>\" + esc(l) + \"\u003c/li>\"; }).join(\"\") + \"\u003c/ul>\";\n  }\n\n  function secInternship(r) {\n    var list = r.internships || [];\n    if (!list.length) return \"\";\n    var items = list.map(function (it) {\n      var range = [j(it.start), j(it.end)].filter(Boolean).join(\" - \");\n      return '\u003cdiv class=\"p-item\">\u003cdiv class=\"p-item-head\">' +\n        '\u003cspan class=\"p-item-title\">' + esc(it.company || \"（公司）\") + (hasText(it.title) ? \" · \" + esc(it.title) : \"\") + \"\u003c/span>\" +\n        '\u003cspan class=\"p-item-range\">' + esc(range) + \"\u003c/span>\u003c/div>\" + bulletsHTML(it.content) + \"\u003c/div>\";\n    });\n    return secWrap(\"实习经历\", \"INTERNSHIP\", items.join(\"\"));\n  }\n\n  function secProject(r) {\n    var list = r.projects || [];\n    if (!list.length) return \"\";\n    var items = list.map(function (it) {\n      var range = [j(it.start), j(it.end)].filter(Boolean).join(\" - \");\n      var sub = [];\n      if (hasText(it.role)) sub.push(it.role);\n      if (hasText(it.tech)) sub.push(it.tech);\n      return '\u003cdiv class=\"p-item\">\u003cdiv class=\"p-item-head\">' +\n        '\u003cspan class=\"p-item-title\">' + esc(it.name || \"（项目）\") + \"\u003c/span>\" +\n        '\u003cspan class=\"p-item-range\">' + esc(range) + \"\u003c/span>\u003c/div>\" +\n        (sub.length ? '\u003cdiv class=\"p-item-sub\">' + esc(sub.join(\" ｜ \")) + \"\u003c/div>\" : \"\") +\n        bulletsHTML(it.content) + \"\u003c/div>\";\n    });\n    return secWrap(\"项目经历\", \"PROJECT\", items.join(\"\"));\n  }\n\n  function secCampus(r) {\n    var list = r.campus || [];\n    if (!list.length) return \"\";\n    var items = list.map(function (it) {\n      var range = [j(it.start), j(it.end)].filter(Boolean).join(\" - \");\n      return '\u003cdiv class=\"p-item\">\u003cdiv class=\"p-item-head\">' +\n        '\u003cspan class=\"p-item-title\">' + esc(it.org || \"（组织）\") + (hasText(it.role) ? \" · \" + esc(it.role) : \"\") + \"\u003c/span>\" +\n        '\u003cspan class=\"p-item-range\">' + esc(range) + \"\u003c/span>\u003c/div>\" + bulletsHTML(it.content) + \"\u003c/div>\";\n    });\n    return secWrap(\"校园经历\", \"CAMPUS\", items.join(\"\"));\n  }\n\n  function secResearch(r) {\n    var list = r.research || [];\n    if (!list.length) return \"\";\n    var items = list.map(function (it) {\n      var head = [];\n      if (hasText(it.kind)) head.push(esc(it.kind));\n      head.push(esc(it.title || \"（名称）\"));\n      var meta = [];\n      if (hasText(it.role)) meta.push(esc(it.role));\n      if (hasText(it.venue)) meta.push(esc(it.venue));\n      if (hasText(it.date)) meta.push(esc(it.date));\n      var note = hasText(it.note) ? bulletsHTML(it.note) : \"\";\n      return '\u003cdiv class=\"p-item\">\u003cdiv class=\"p-item-head\">\u003cspan class=\"p-item-title\">' + head.join(\" · \") + \"\u003c/span>\u003c/div>\" +\n        (meta.length ? '\u003cdiv class=\"p-item-sub\">' + meta.join(\" ｜ \") + \"\u003c/div>\" : \"\") +\n        note + \"\u003c/div>\";\n    });\n    retu
