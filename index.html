<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=./dist/resume-workbench.html">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeCraft</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { max-width: 640px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08); }
  h1 { margin: 0 0 10px; font-size: 28px; }
  p { margin: 0 0 12px; line-height: 1.7; color: #475569; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  a { text-decoration: none; }
  .btn { display: inline-block; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
  .primary { background: #2563eb; color: #fff; }
  .ghost { background: #eff6ff; color: #1d4ed8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ResumeCraft</h1>
    <p>正在进入简历工作台。如果页面没有自动跳转，请点击下面的按钮。</p>
    <p>普通用户直接打开网页版即可，不需要安装 DSH，也不需要使用 Git。</p>
    <div class="actions">
      <a class="btn primary" href="./dist/resume-workbench.html">立即打开网页版</a>
      <a class="btn ghost" href="https://github.com/Cherish299/ResumeCraft">查看开源仓库</a>
    </div>
  </div>
</div>
</body>
</html>
